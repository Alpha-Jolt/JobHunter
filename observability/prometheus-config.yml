global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'jobhunter-orchestration'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['jobhunter-api:8000']
        labels:
          environment: "development"

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
