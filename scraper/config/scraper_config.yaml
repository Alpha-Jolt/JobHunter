scrapers:
  indeed:
    enabled: true
    base_url: "https://in.indeed.com/jobs"
    timeout_ms: 30000
    pages_per_search: 5
    rate_limit: 1.0

  naukri:
    enabled: true
    base_url: "https://www.naukri.com/api/v5"
    timeout_ms: 15000
    pages_per_search: 5
    rate_limit: 0.5

  linkedin:
    enabled: false
    reason: "API partnership pending"

pipeline:
  extraction:
    enabled: true
  cleaning:
    enabled: true
  normalization:
    enabled: true
  deduplication:
    enabled: true

output:
  formats: []
  directory: "output"

company_discovery:
  bootstrap_sources:
    enabled: true
    monthly_refresh: true
  discovery_mode:
    max_queries_per_session: 15
    pause_between_sessions_minutes: 5
    search_engine_primary: "duckduckgo"
    search_engine_fallback: "bing"
  enrichment:
    robots_check_timeout_seconds: 5
    page_request_timeout_seconds: 30
    rate_limit_rps: 0.33
  email_refresh:
    refresh_interval_days: 30

career_page:
  enabled: true
  rate_limit_rps: 1.0
  sitemap_rate_limit_rps: 0.33
  playwright_timeout_ms: 30000
  weekly_refresh_day: "monday"
  weekly_refresh_hour: 4
