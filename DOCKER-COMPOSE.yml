services:
  minio:
    image: minio/minio:latest
    container_name: jobhunter-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobhunter_network

  scraper:
    build:
      context: .
      dockerfile: scraper/docker/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./scraper/output:/app/output
      - ./scraper/logs:/app/logs
      - ./registries:/app/registries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobhunter_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Browser never calls this directly (uses /api proxy); rewrite target is internal.
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://admin-api.myjobhunter.in}
        ADMIN_API_INTERNAL_URL: ${ADMIN_API_INTERNAL_URL:-http://admin-api:8003}
    container_name: jobhunter-admin
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://admin-api.myjobhunter.in}
    depends_on:
      - admin-api
    networks:
      - jobhunter_network

  admin-api:
    build:
      context: ./admin_api
      dockerfile: Dockerfile
    container_name: jobhunter-admin-api
    env_file:
      - .env
    volumes:
      - ./scraper/logs:/scraper/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobhunter_network

  redis:
    image: redis/redis-stack-server:7.2.0-v9
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobhunter_network

  postgres:
    image: postgres:15-alpine
    container_name: jobhunter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunter} -d ${POSTGRES_DB:-jobhunter}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobhunter_network

  jobhunter-api:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: jobhunter-api
    env_file:
      - .env
    environment:
      MAIL_BRIDGE_URL: ${MAIL_BRIDGE_URL:-https://app.myjobhunter.in}
      MAIL_BRIDGE_API_KEY: ${MAIL_BRIDGE_API_KEY}
      MAILBRIDGE_WEBHOOK_SECRET: ${MAILBRIDGE_WEBHOOK_SECRET}
      MAILBRIDGE_WEBHOOK_ID: ${MAILBRIDGE_WEBHOOK_ID}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobhunter_network

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.myjobhunter.in}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.myjobhunter.in}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://jobhunter-api:8000}
    container_name: jobhunter-webapp
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://jobhunter-api:8000}
    depends_on:
      jobhunter-api:
        condition: service_healthy
    networks:
      - jobhunter_network

volumes:
  minio_data:
  postgres_data:

networks:
  jobhunter_network:
    driver: bridge
