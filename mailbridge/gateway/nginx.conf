worker_processes auto;
events { worker_connections 1024; }

http {
  # Rate limit zones
  # Auth routes — allow normal login/register retries (was 3r/m → false 429/401 storms)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/s;

  # OWASP: Add header-based security
  add_header X-Content-Type-Options  "nosniff"       always;
  add_header X-Frame-Options         "DENY"          always;
  add_header X-XSS-Protection        "1; mode=block" always;
  add_header Referrer-Policy         "no-referrer"   always;

  # Mask server identity
  server_tokens off;

  # Request body size limit
  client_max_body_size 1m;

  # Device fingerprint: hash of IP + User-Agent
  map "$remote_addr$http_user_agent" $device_fp {
    default "";
    "~^(.+)$" $1;
  }

  server {
    listen 3009;

    # Docker's internal DNS resolver — resolves upstream hostnames dynamically
    # at request time so nginx starts even if backend containers aren't ready yet
    resolver 127.0.0.11 valid=10s;

    set $auth_upstream        "http://mb-auth:3001";
    set $credentials_upstream "http://mb-credentials:3002";
    set $emails_upstream      "http://mb-emails:3003";
    set $templates_upstream   "http://mb-templates:3004";
    set $admin_upstream       "http://mb-admin:3005";
    set $health_upstream      "http://mb-health:3006";
    set $webhooks_upstream    "http://mb-webhooks:3008";

    # Inject device fingerprint header on all requests
    proxy_set_header X-Device-Fingerprint $device_fp;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header Host                $host;

    # Auth routes — strict rate limit
    location /auth {
      limit_req zone=auth_limit burst=20 nodelay;
      limit_req_status 429;
      proxy_pass $auth_upstream;
    }

    # Credentials
    location /api/credentials {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass $credentials_upstream;
    }

    # Emails
    location /api/emails {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass $emails_upstream;
    }

    # Inbound Emails (Webhooks from providers)
    location /api/inbound {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass $emails_upstream;
    }

    # Templates
    location /api/templates {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass $templates_upstream;
    }

    # Admin
    location /api/admin {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass $admin_upstream;
    }

    # Health
    location /health {
      proxy_pass $health_upstream;
    }

    # Webhooks
    location /api/webhooks {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass $webhooks_upstream;
    }

    # Default 404
    location / {
      return 404;
    }
  }
}
