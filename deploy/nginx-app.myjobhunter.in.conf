# VPS: /etc/nginx/sites-available/app.myjobhunter.in
# App default: /docker/JobHunter  ->  docker compose  ->  127.0.0.1:3003 (webapp), :8004 (api)
# Mail-Bridge gateway:            ->  docker compose  ->  127.0.0.1:3009 (mb gateway)
# Mail-Bridge webapp:             ->  docker compose  ->  127.0.0.1:3010 (mb webapp)
#
# Path routing on app.myjobhunter.in:
#   /mailbridge/auth|health + OAuth callbacks  ->  gateway :3009 (prefix stripped)
#   /mailbridge/*                              ->  Mail-Bridge Next :3010 (basePath kept)
#   /*                                         ->  JobHunter webapp :3003
#
# Enable once:
#   sudo ln -sf /etc/nginx/sites-available/app.myjobhunter.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare DNS: A/AAAA records for app / api / admin / admin-api -> this VPS
# Origin cert: reuse /etc/ssl/cloudflare/jobhunter/ (must include app.* SANs) or expand cert

############################################
# HTTP -> HTTPS
############################################
server {
    listen 80;
    server_name app.myjobhunter.in api.myjobhunter.in admin.myjobhunter.in admin-api.myjobhunter.in;
    return 301 https://$host$request_uri;
}

############################################
# App frontend + Mail-Bridge (app.myjobhunter.in)
#
# /mailbridge/api/*  and /mailbridge/auth/*
#   -> Mail-Bridge gateway :3009 (prefix stripped)
# /mailbridge/*
#   -> Mail-Bridge webapp :3010 (prefix stripped)
# /*
#   -> JobHunter webapp :3003
############################################
server {
    listen 443 ssl http2;
    server_name app.myjobhunter.in;

    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Mail-Bridge ----
    # Next.js is built with basePath=/mailbridge — do NOT strip the prefix.
    # Browser APIs go to the Next BFF at /mailbridge/api/* → gateway (Docker).
    # Only auth/health + OAuth/webhook callbacks hit the gateway directly.

    location = /mailbridge {
        return 301 https://$host/mailbridge/;
    }

    # Gateway: auth + health (strip /mailbridge)
    location ~ ^/mailbridge/(auth|health)(/.*)?$ {
        rewrite ^/mailbridge/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Gateway: OAuth callbacks + inbound provider webhooks (strip /mailbridge)
    location ~ ^/mailbridge/api/(credentials/.+/callback|webhooks)(/.*)?$ {
        rewrite ^/mailbridge/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Mail-Bridge Next.js console (keeps /mailbridge prefix for basePath)
    location /mailbridge/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- JobHunter webapp ----
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /jobhunter-resumes/ {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /jobhunter-avatars/ {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}

############################################
# Orchestration API (Docker @ 8004)
############################################
server {
    listen 443 ssl http2;
    server_name api.myjobhunter.in;

    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # CORS — answer preflight requests immediately at nginx level
    # to avoid a round-trip to FastAPI that might not return headers
    # when the request is blocked before reaching the app.
    set $cors_origin "";
    if ($http_origin ~* "^https://(app|admin)\.myjobhunter\.in$") {
        set $cors_origin $http_origin;
    }

    location / {
        # Handle OPTIONS preflight directly
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods  "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers  "Authorization, Content-Type, X-Request-ID, Cookie" always;
            add_header Access-Control-Max-Age        86400 always;
            return 204;
        }

        # Propagate CORS headers on every real response too
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;

        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}


############################################
# Admin UI (Docker @ 5004) -- optional
############################################
server {
    listen 443 ssl http2;
    server_name admin.myjobhunter.in;

    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

############################################
# Admin API (Docker @ 8005) -- optional
############################################
server {
    listen 443 ssl http2;
    server_name admin-api.myjobhunter.in;

    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
